<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gastos</title>
    <!-- Corrección: El archivo CSS debe enlazarse con la etiqueta <link> -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1> Sistema de Gastos</h1>

        <!-- Sección de Registro -->

            <h2>Registro</h2>

            <button onclick="registrar()">Registrar</button>
        </div>

        
<script src="app.js"></script>

</body>
</html>
